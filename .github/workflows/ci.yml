name: CI Pipeline

on:
  push:
    branches:
      - main
      - tw-session*
  pull_request:
    branches:
      - main

jobs:
  job_submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set TSID environment variable
        run: echo "TSID=2239944" >> $GITHUB_ENV
      - name: Check branch
        run: echo "${{ github.ref }}" | grep "tw-session"
      - name: Form payload
        id: form_payload
        run: |
          FORM_PAYLOAD="branch=${{ github.ref_name }}&sha=${{ github.sha }}&url=${{ github.repository }}&message=${{ github.event.head_commit.message }}&author=${{ github.actor }}"
          echo "FORM_PAYLOAD=$FORM_PAYLOAD" >> $GITHUB_ENV
      - name: Submit to external service
        run: |
          curl -H "Content-Type: application/x-www-form-urlencoded" -d "${{ env.FORM_PAYLOAD }}" -X POST "http://172.104.5.197/workbook/submit/${{ env.TSID }}"

  build_job:
    runs-on: ubuntu-latest
    needs: job_submit
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Compile code
        run: echo "Compiling the code..."
      - name: Compilation complete
        run: echo "Compile complete."

  lint_test_job:
    runs-on: ubuntu-latest
    needs: job_submit
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Lint code
        run: echo "Linting code... This will take about 10 seconds."

  deploy_job:
    runs-on: ubuntu-latest
    needs: [build_job, lint_test_job]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Deploy application
        run: echo "Deploying application..."
      - name: Deployment complete
        run: echo "Application successfully deployed."
